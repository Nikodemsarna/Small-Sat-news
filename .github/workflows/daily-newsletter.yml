name: Daily Vibe Coding Newsletter

# Runs every morning and emails the vibe-coding digest.
# Also runnable on demand (workflow_dispatch), with an optional dry run.
on:
  # Automatic daily schedule is DISABLED — the newsletter is stopped.
  # To resume, uncomment the schedule block below.
  # schedule:
  #   - cron: "30 7 * * *"   # 07:30 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not send"
        type: boolean
        default: false
      test_email:
        description: "Send a TEST email now (uses sample stories if none are live)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          # Only needed if you use the Anthropic provider.
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install "anthropic>=0.49.0"
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Build and send newsletter
        env:
          # Summarization — set ONE of these (Gemini and Groq are free).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIBE_PROVIDER: ${{ vars.VIBE_PROVIDER }}
          # Delivery — set EITHER the Resend secret OR the SMTP_* secrets.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional overrides (otherwise defaults from the code apply).
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          VIBE_MODEL: ${{ vars.VIBE_MODEL }}
          VIBE_EFFORT: ${{ vars.VIBE_EFFORT }}
          VIBE_WINDOW_HOURS: ${{ vars.VIBE_WINDOW_HOURS }}
          VIBE_MAX_ARTICLES: ${{ vars.VIBE_MAX_ARTICLES }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m vibecoding_news --dry-run --output output/edition.html
          elif [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python -m vibecoding_news --test --output output/edition.html
          else
            python -m vibecoding_news --output output/edition.html
          fi

      - name: Upload rendered edition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-edition
          path: output/edition.html
          if-no-files-found: ignore
          retention-days: 14
