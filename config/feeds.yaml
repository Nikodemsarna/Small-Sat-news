# Vibe Coding Daily — source portals
#
# Feeds from across the developer-tools and AI press that surface "vibe coding"
# news: AI coding assistants/agents, the practice, launches, and benchmarks.
# Feeds that fail to load on a given day are logged and skipped, so the
# newsletter degrades gracefully. `name` is shown as the story's source label.

feeds:
  # --- Hacker News (targeted searches + front page) ---
  # hnrss is very reliable and lets us target the topic precisely.
  - name: Hacker News — "vibe coding"
    url: https://hnrss.org/newest?q=%22vibe+coding%22&count=40
  - name: Hacker News — AI coding tools
    url: https://hnrss.org/newest?q=Copilot+OR+Cursor+OR+%22Claude+Code%22+OR+Codeium+OR+Aider+OR+Devin&count=40
  - name: Hacker News — front page
    url: https://hnrss.org/frontpage

  # --- AI-coding-focused blogs / newsletters ---
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
  - name: Latent Space
    url: https://www.latent.space/feed
  - name: GitHub Blog
    url: https://github.blog/feed/

  # --- General AI / dev-tools press ---
  - name: TechCrunch — AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
  - name: The Verge — AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
  - name: VentureBeat — AI
    url: https://venturebeat.com/category/ai/feed/
  - name: Ars Technica
    url: https://arstechnica.com/feed/
  - name: InfoQ
    url: https://feed.infoq.com/
  - name: The Register — Software
    url: https://www.theregister.com/software/headlines.atom
  - name: dev.to — AI
    url: https://dev.to/feed/tag/ai
